<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join MirrorMatch</title>
<!-- Printed QR codes point here, so the destination can change (TestFlight now, the App Store at launch)
     without reprinting anything. Change JOIN_URL in both places below. -->
<meta http-equiv="refresh" content="0; url=https://testflight.apple.com/join/YgGQkuGb">
<style>
  :root { --bg: #ffffff; --text: #16131f; --muted: #5d5872; --accent: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e0c14; --text: #f3f1fa; --muted: #a9a3bd; --accent: #a58bff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { color: var(--muted); }
  a.button { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>MirrorMatch</h1>
  <p>Opening the MirrorMatch beta on TestFlight…</p>
  <a class="button" href="https://testflight.apple.com/join/YgGQkuGb">Join the beta</a>
  <p style="font-size:14px">iPhone only for now · 18+</p>
</main>
<script>location.replace('https://testflight.apple.com/join/YgGQkuGb');</script>
</body>
</html>
