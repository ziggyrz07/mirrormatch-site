<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MirrorMatch</title>
<meta name="description" content="MirrorMatch, a dating app for adults 18 and over.">
<style>
  :root { --bg:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#c2185b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111113; --text:#f2f2f7; --muted:#a1a1a6; --line:#2c2c2e; --accent:#ff6fa3; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:34px; margin:0 0 8px; }
  p { margin:0 0 16px; }
  .muted { color:var(--muted); }
  a.button { display:inline-block; padding:12px 18px; border-radius:12px; border:1px solid var(--line); color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>MirrorMatch</h1>
  <p class="muted">A dating app for adults 18 and over. Currently in private beta.</p>
  <p><a class="button" href="privacy/">Privacy Policy</a></p>
</main>
</body>
</html>
